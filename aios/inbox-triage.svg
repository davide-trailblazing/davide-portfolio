<svg viewBox="0 0 1200 730" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="1200" height="730" rx="18" fill="#F8F7F4"/>
  <text x="52" y="52" fill="#C89B3C" font-size="23" font-weight="700" letter-spacing="1.5">INVESTOR INBOX — SORTED BEFORE I OPEN IT</text>
  <text x="52" y="104" fill="#1E2761" font-size="38" font-weight="700">Every reply, already in the right pile.</text>

  <rect x="50" y="150" width="340" height="430" rx="16" fill="#FFFFFF" stroke="#DDD9CF" stroke-width="2"/>
  <text x="80" y="192" fill="#6B6A64" font-size="17" font-weight="700" letter-spacing="1">OVERNIGHT</text>
  <g fill="#EFEDE7">
    <rect x="80" y="214" width="280" height="34" rx="7"/><rect x="80" y="258" width="280" height="34" rx="7"/>
    <rect x="80" y="302" width="280" height="34" rx="7"/><rect x="80" y="346" width="280" height="34" rx="7"/>
    <rect x="80" y="390" width="280" height="34" rx="7"/><rect x="80" y="434" width="280" height="34" rx="7"/>
    <rect x="80" y="478" width="280" height="34" rx="7"/>
  </g>
  <text x="80" y="548" fill="#1E2761" font-size="26" font-weight="700">31 replies</text>

  <path d="M410 365 L470 365" stroke="#C89B3C" stroke-width="6" stroke-linecap="round"/>
  <path d="M456 351 L474 365 L456 379" fill="none" stroke="#C89B3C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="500" y="150" width="650" height="128" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
    <rect x="500" y="150" width="10" height="128" rx="5" fill="#2E7D5B"/>
    <text x="540" y="200" fill="#2E7D5B" font-size="22" font-weight="700">YES, BOOK THEM</text>
    <text x="540" y="238" fill="#3A3A3A" font-size="19">9 investors said yes and need a slot</text>
  </g>
  <g>
    <rect x="500" y="301" width="650" height="128" rx="14" fill="#FFFFFF" stroke="#C89B3C" stroke-width="3"/>
    <rect x="500" y="301" width="10" height="128" rx="5" fill="#C89B3C"/>
    <text x="540" y="351" fill="#9A7526" font-size="22" font-weight="700">ASKED FOR A DATE</text>
    <text x="540" y="389" fill="#3A3A3A" font-size="19">14 want times before they commit</text>
  </g>
  <g>
    <rect x="500" y="452" width="650" height="128" rx="14" fill="#FFFFFF" stroke="#B0AAA0" stroke-width="3"/>
    <rect x="500" y="452" width="10" height="128" rx="5" fill="#B0AAA0"/>
    <text x="540" y="502" fill="#6B6A64" font-size="22" font-weight="700">WENT QUIET</text>
    <text x="540" y="540" fill="#3A3A3A" font-size="19">8 to follow up next week</text>
  </g>

  <rect x="50" y="616" width="1100" height="66" rx="12" fill="#1E2761"/>
  <text x="80" y="658" fill="#FFFFFF" font-size="21" font-weight="700">It sorts. It never sends. Every message still leaves with my name on it.</text>
</svg>
